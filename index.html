<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de Gestão para Oficinas Mecânicas - Controle de OS, Financeiro e Clientes" />
    <meta name="theme-color" content="#0E0F12" />
    
    <title>OficinaPRO - Gestão de Oficinas</title>
    
    <script>
      /* Tema salvo (chave "oficina.theme" no localStorage): aplica antes do primeiro desenho, sem flash.
         Sem valor salvo, segue o tema escuro padrão. */
      try {
        if (localStorage.getItem('oficina.theme') === 'pastel') {
          document.documentElement.setAttribute('data-theme', 'pastel');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F7F5FA');
        }
      } catch (e) { /* localStorage indisponível: segue o escuro */ }
    </script>

    <style>
      /* Estilo inline crítico para evitar FOUC (Flash of Unstyled Content) */
      html {
        background-color: #0E0F12;
        color: #ECECEE;
      }
      html[data-theme="pastel"] {
        background-color: #F7F5FA;
        color: #241D2E;
      }
      
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
          Ubuntu, Cantarell, 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        min-height: 100vh;
      }
      
      /* Skeleton loading animation */
      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }
      
      .skeleton {
        background: linear-gradient(
          90deg,
          #1F2126 0%,
          #272A30 50%,
          #1F2126 100%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s ease-in-out infinite;
        border-radius: 4px;
      }
      
      .skeleton-block {
        width: 100%;
        height: 100px;
      }
      
      /* Spinner */
      .spinner {
        border: 3px solid rgba(236, 236, 238, 0.1);
        border-top: 3px solid #D4A514;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      /* Card styling for loading states */
      .card {
        background: #17181C;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
